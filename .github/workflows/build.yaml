name: Build Static Image
on:
  push:
    branches: ["main"]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "skekdog/traitor-uploader"

jobs:
  amd64:
    if: github.repository == 'Skekdog/Traitor-Uploader'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: commit
        name: Commit Hash
        uses: prompt/actions-commit-hash@v3.0.0

      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          file: Dockerfile
          context: .
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Deploy Webhook
        run: |
          curl --request POST --max-time 1 --silent '${{ secrets.DEPLOY_WEBHOOK }}' || true
